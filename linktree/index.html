        body {

}



        p{

        header {
            width: 95%;
            max-width: 788px;
            display: flex;
            justify-content: flex-end;
            padding: 12px;
            margin-top: 15px;
        }

        .share-button {
            width: 40px;

            border-radius: 20px;
            background-color: #000;
        }

        .share-button svg {
            margin-left: 12px;
            margin-top: 10px;
            color: rgb(0, 0, 0);
        }

        .container {
            width: 91%;
            max-width: 680px;
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 30px;
        }

            text-decoration: none;
            color: rgb(0, 0, 0);
        }

        .tile {
            width: 100%;
            background: hwb(0 100% 0%);
            margin: 7px;
            border-radius: 17px;
            box-shadow: 0px -3px 15px 0px var(--primaryHi) inset;
            display: flex;
            justify-content: space-between;
            /* backdrop-filter: blur(10px); */
            position: relative;
            overflow: hidden;
        }

        .tile::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            transform: scaleY(-1);
            box-shadow: 0 -5px 15px rgb(0 0 0 / 26%);
        }

        .tile span {
            width: 100px;
            height: 60px;
            background-color: var(--primaryHi);
            border-radius: 100%;
            filter: blur(20px);
            position: absolute;
            bottom: -50%;
            transition: all 0.2s ease;
        }

        .tile:hover {
            transform: scale(1.02);
        }

        .tile-share-button {
            margin: 8px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
        }

        .tile-share-button svg {
            margin-left: 12px;
            margin-top: 10px;
        }

        .image-container {
            height: 120px;
            width: 120px;
            border-radius: 148px;
            border: 5px solid black;
            overflow: hidden;
        }

        .image-container img {
            height: 100%;
        }

        .icon {
            margin: 4px 8px;
            width: 50px;
            height: 50px;
        }

        .linktree {
            margin-top: 34px;
            margin-bottom: 34px;
            font-weight: bold;
        }


        body::-webkit-scrollbar {
  width: 12px;               /* width of the entire scrollbar */
}

body::-webkit-scrollbar-track {
  background: #ff9006;        /* color of the tracking area */
}

body::-webkit-scrollbar-thumb {
  background-color: #FF9006;    /* color of the scroll thumb */
  border-radius: 20px;       /* roundness of the scroll thumb */
  border: 3px solid #FF9006;  /* creates padding around scroll thumb */
}

    <script>
        const shareButtons = document.querySelectorAll('.tile-share-button')

        async function copyText(e) {
            e.preventDefault()
            const link = this.getAttribute('link')
            console.log(link)

            try {
                await navigator.clipboard.writeText(link)
                alert("Texto Copiado: " + link)
            } catch (err) {
                console.error(err);
            }
        }

        shareButtons.forEach(shareButton =>
            shareButton.addEventListener('click', copyText))
    </script>
